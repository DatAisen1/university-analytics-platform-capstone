# docker/docker-compose.yml
#
# Local development environment for the University Academic Analytics Platform.
# Brings up the two stateful services the pipeline depends on:
#   - postgres : the data warehouse (bronze/silver/gold/marts/meta schemas)
#   - minio    : S3-compatible object storage for Bronze/Silver/Gold Parquet files
#
# Deliberately NOT included yet: Dagster, dbt, Superset. Those are added in
# Week 3-4 per docs/12_Implementation_Roadmap.md, once there's something for
# them to orchestrate/transform/display. Standing up empty services ahead of
# their actual use just adds services to keep alive with nothing to verify
# against yet.
#
# Preferred entry point: `make up` / `make down` / `make ps` from the repo
# root (see the root Makefile) -- it always passes the right flags for you.
# Running plain `docker compose up -d` still works too, from EITHER the repo
# root or this docker/ directory: see the env_file: ../.env line on each
# service below, which is resolved relative to *this file's own location*,
# not your current shell directory, so it finds the real .env either way.
#
# Task 53 fix: previously POSTGRES_USER/PASSWORD/DB and MINIO_ROOT_USER/
# PASSWORD were only ever referenced via bare ${VAR} interpolation, which
# Compose auto-discovers from a .env file it looks for in "the project
# directory" -- which defaults to THIS file's directory (docker/), not the
# repo root where .env actually lives, unless you always remember
# `--env-file ../.env` / `--env-file .env` (run from root). Forget that flag
# (e.g. `cd docker && docker compose up -d`) and Compose silently substitutes
# an empty string for each undefined variable ("POSTGRES_USER not set"
# warnings) instead of failing -- so Postgres/MinIO would start with blank
# credentials rather than refusing to start. Two independent fixes below,
# together closing both the "wrong invocation" and the "never copied
# .env.example" cases:
#   1. env_file: ../.env on each service -- always resolved relative to this
#      file, so the container's actual runtime environment is populated
#      correctly no matter which directory `docker compose` was invoked from.
#   2. ${VAR:?message} on every required credential below -- this is Compose
#      variable interpolation (a completely separate mechanism from
#      env_file, evaluated before docker even starts), so it fails the
#      command immediately with a clear, actionable error if that variable
#      truly isn't set anywhere Compose can see it (e.g. .env doesn't exist
#      at all yet). No more silent blanks either way.
#
# The "version:" top-level key is intentionally omitted — it's deprecated in
# current Docker Compose (v2) and ignored with a warning if present.

services:
  postgres:
    image: postgres:16-alpine
    container_name: uap_postgres
    restart: unless-stopped
    env_file:
      # required: false -- if .env is missing entirely, let the ${VAR:?...}
      # guards below fire with OUR clear message instead of a generic
      # "env file not found" error from this directive.
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is not set -- run 'cp .env.example .env', fill in real values, then re-run}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set -- run 'cp .env.example .env', fill in real values, then re-run}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is not set -- run 'cp .env.example .env', fill in real values, then re-run}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ (not $) so pg_isready reads POSTGRES_USER/DB from the CONTAINER's
      # own environment at runtime -- guaranteed present via env_file above
      # -- instead of Compose interpolating them on the host at parse time.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uap_network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: uap_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - path: ../.env
        required: false
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is not set -- run 'cp .env.example .env', fill in real values, then re-run}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is not set -- run 'cp .env.example .env', fill in real values, then re-run}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3-compatible API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      # NOT curl: minio/minio images have shipped WITHOUT curl or wget
      # since the RELEASE.2023-11-01+ line (curl removed upstream --
      # see minio/minio#18373, #18389, #18375). This image is pinned to
      # RELEASE.2024-05-10, well after that change, so a curl-based
      # test execs a binary that doesn't exist *inside the container*
      # and fails every single run -- Docker would report this service
      # permanently "unhealthy" even though MinIO itself is fully up
      # and serving traffic on 9000. `mc` (the MinIO client) IS bundled
      # in the image and is upstream's own documented replacement
      # (minio/minio#18375: "if you insist on using Docker's
      # healthchecks, embrace `mc ready local`"). `local` here is a
      # built-in alias MinIO registers for its own instance -- no `mc
      # alias set` or credentials required.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uap_network

networks:
  uap_network:
    name: uap_network
    driver: bridge

volumes:
  # Named (Docker-managed) volumes, not bind mounts — portable across
  # Linux/Mac/Windows hosts with no host-path permission issues, and easy to
  # nuke with `docker compose down -v` for a clean-slate reset.
  pgdata:
  miniodata: