# data_generator/config/progression_rules.yaml
#
# Tunable parameters for the student progression engine (dropout,
# graduation, stall, shifter probabilities). Kept as config, not constants
# buried in generate_progression.py, for the same reason volumes.yaml is
# config: these are calibration knobs, and "how sensitive is dropout to
# risk_score" is exactly the kind of thing a reviewer should be able to
# see and adjust without reading Python.

random_seed: 43   # deliberately different from generate_students.py's seed (42) --
                   # student generation and progression simulation are independent
                   # random processes and shouldn't share a seed/stream.

# Semester index 0 = 2021-1 ... index 9 = 2025-2 (inclusive). See
# generate_progression.semester_index_to_label for the mapping. Must stay
# in sync with pipelines.common.academic_periods.OBSERVED_MAX_PERIOD_ORDINAL
# (the canonical source) -- this file can't import Python, so the value
# is duplicated here by necessity, not oversight; if the observed window
# changes again, update both.
#
# P0 (Dataset Extension): extended from 5 (6 periods, 2021-2023) to 9
# (10 periods, 2021-2025). This also resolves a real modeling gap flagged
# in this module's own docstring: under the old 6-period window, 5-year
# programs (Architecture, Engineering) could never produce a single
# natural graduate, since even the 2021 cohort only reached 6 semesters
# of tenure by the window's end -- short of the 10 semesters a 5-year
# program needs. With 10 periods, the 2021 cohort now reaches exactly 10
# semesters of tenure by 2025-2, so 5-year programs can finally graduate
# students within the observed window for the first time.
max_semester_index: 9

dropout:
  # Base per-semester dropout probability by year level -- highest in
  # year 1 (real-world attrition is front-loaded), decaying afterward.
  # Year levels beyond 5 (shouldn't occur given the stall cap) fall back
  # to the highest defined key.
  #
  # Calibrated against CHED's most recent reported national attrition
  # rate for SY 2023-2024 -- 35.15%, down from 40.98% the prior year
  # (CHED chair Prospero de Vera III, Senate budget deliberations, Oct
  # 2023: https://newsinfo.inquirer.net/1839954). These per-semester
  # base rates, combined with the risk-multiplier's average effect
  # (~0.93x, from the risk_score beta(2,5) distribution's mean of
  # 0.286), were solved to produce ~35% cumulative dropout over a
  # nominal 4-year program -- not eyeballed, worked backward from the
  # target and then verified empirically against actual generator
  # output (see docs/08_Faker_Data_Generator.md's calibration note).
  # Front-loaded shape matches the cohort-survival literature finding
  # that retention is lowest at the first-year level (Undergraduate
  # Cohort Survival and Retention Rates, ResearchGate, 2022).
  base_prob_by_year_level:
    1: 0.108
    2: 0.050
    3: 0.030
    4: 0.025
    5: 0.025
  # Risk multiplier interpolates linearly between these bounds as
  # risk_score goes from 0 -> 1. A risk_score of 0 halves the base rate;
  # a risk_score of 1 doubles it.
  risk_multiplier_min: 0.5
  risk_multiplier_max: 2.0
  # Each prior stall (re-enrolled at the same year level) adds this much
  # *relative* increase to dropout probability -- stalling is a leading
  # indicator of eventually leaving.
  stall_multiplier_per_stall: 0.5
  max_probability: 0.35
  reason_weights:
    Financial: 0.35
    Academic: 0.30
    Personal: 0.20
    "Transferred Institution": 0.10
    Unknown: 0.05

graduation:
  # Once a student reaches nominal-duration-or-beyond, this is the
  # probability of graduating THIS semester, ramping up for each extra
  # semester past nominal duration (most eligible students finish within
  # a few extra semesters rather than lingering indefinitely).
  base_probability: 0.35
  ramp_per_extra_semester: 0.15
  max_probability: 0.9
  # Higher risk_score reduces graduation probability even once eligible
  # (struggling students are less likely to finish on reaching eligibility,
  # not just more likely to drop out earlier).
  risk_penalty_factor: 0.3

stall:
  base_probability: 0.08
  risk_multiplier_min: 0.5
  risk_multiplier_max: 2.0
  # year_level is capped at nominal_duration_years + this many extra years,
  # so a perpetually-stalling student doesn't accumulate an unbounded
  # year_level -- they just stay capped (and keep accumulating stall_count,
  # which keeps pushing dropout probability up).
  max_year_level_cap_extra_years: 2

shifter:
  # Shifting is only modeled in years 1-2, reflecting real curriculum
  # lock-in after that point (see docs/08_Faker_Data_Generator.md).
  #
  # NOTE on confidence: this is the weakest-sourced calibration in this
  # file. The only Philippine-specific number found was a 31-39% SHS-to-
  # college COURSE MISMATCH rate (Exploring Between SHS Strand and
  # College Course Mismatch, ResearchGate, 2022) -- a proxy for "wrong
  # initial fit," not a direct "formally changed program after
  # enrolling" rate; not every mismatched student actually files a
  # shift (some tolerate it, some drop out instead). Treated as a soft
  # upper bound, not a target. Raised from a prior ~5.9% cumulative rate
  # (clearly too low) to ~13% cumulative -- a documented judgment call,
  # not a directly-derived figure like dropout above.
  probability_year_1: 0.09
  probability_year_2: 0.045
  # Probability the new program is drawn from the SAME college (a lateral
  # move within, e.g., CICT) vs. a genuinely different college.
  same_college_weight: 0.7
  max_shifts_per_student: 1

enrollment:
  units_enrolled_min: 15
  units_enrolled_max: 24