# configs/programs.yaml
#
# Reference data: NEUST Sumacab Campus programs, one entry per program,
# each pointing at its owning college via college_id (must exist in
# configs/colleges.yaml — enforced by pipelines/common/config.py).
#
# nominal_duration_years drives graduation-eligibility logic in the Faker
# progression engine (Day 5) and later in Gold's graduation-rate calculation
# (fact_institution_kpi) — it lives here, as config, specifically so that
# business logic ("when should this program's students graduate") is a data
# fact administrators can review and correct, not a number buried in code.
#
# program_level: one of Bachelor | Certificate | Diploma

