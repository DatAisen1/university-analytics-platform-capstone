[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is deliberately NOT set here -- migrations/env.py builds
# it from PostgresSettings (pipelines.common.settings, .env-aware) at
# runtime instead. A placeholder value here (e.g. the SQLAlchemy template
# default "driver://user:pass@localhost/dbname") is silently picked up by
# `engine_from_config` if env.py's URL construction is ever bypassed,
# producing an opaque NoSuchModuleError far from the real cause -- leaving
# the key absent instead surfaces a clear "sqlalchemy.url not set" error
# from Alembic itself if that ever happens.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s