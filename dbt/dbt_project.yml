# dbt/dbt_project.yml
#
# See docs/07_Technology_Stack.md Section 4 for why dbt: version-controlled
# SQL, built-in testing, and auto-generated documentation/lineage turn
# "we have data quality and documentation" from a manual writing exercise
# into a natural byproduct of doing the transformation work correctly.
#
# Schema note (an adaptation from the folder-per-layer plan, made explicit):
# staging/ and marts/ are separate FOLDERS here (matching docs/03's repo
# structure), but both materialize into the single `marts` Postgres schema
# -- not a separate `staging` schema. Inventing a new Postgres schema for
# staging would mean revisiting Day 15's already-tested RBAC grants
# (dbt_role only has USAGE+SELECT on `gold` and full read/write on
# `marts`); collapsing staging into `marts` avoids that without changing
# the model organization dbt users actually see. Layers are distinguished
# by name prefix (stg_ vs mart_), not by schema, and neither models
# subfolder sets a custom +schema override, so both simply inherit the
# profile's target schema.

name: 'university_analytics'
version: '1.0.0'
config-version: 2

profile: 'university_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  university_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table

# P2 -- Trend Analysis thresholds (dbt/macros/trend_metrics.sql). Vars,
# not literals inlined in the SQL, the same way build_kpi.py's WEIGHTS
# is a module-level dict rather than inlined numbers -- lets these be
# tuned or sensitivity-tested without touching the macro.
vars:
  # Minimum periods observed for a series before trend_classification()
  # will emit a directional label at all; below this, every row gets
  # 'insufficient_history' regardless of slope.
  trend_min_periods: 3
  # Deadband around zero slope (as a fraction of the series' trailing
  # average) inside which a series is classified 'stable' rather than
  # 'increasing'/'decreasing'. 0.02 = slope must exceed 2% of the
  # trailing average, per period, to count as directional movement.
  trend_deadband_pct: 0.02