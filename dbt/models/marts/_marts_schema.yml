#\\# dbt/models/marts/_marts_schema.yml
# Every mart gets not_null on its grain-defining columns, uniqueness on
# that grain (single-column `unique` where the grain is one column,
# dbt_utils.unique_combination_of_columns where it's composite -- dbt's
# built-in `unique` test only covers a single column), and
# `relationships` tests back to the dimension each mart joins against.
# This is the Day 17 validation checklist item made concrete: "every
# mart has not_null/unique/relationships tests defined," not just some.

version: 2

models:
  - name: mart_institution_kpi
    description: "One row per (college, semester): all Institutional Success Index sub-components + composite, with human-readable labels."
    columns:
      - name: college_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_college')
                field: college_key
      - name: academic_period_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_academic_period')
                field: academic_period_key
      - name: institutional_success_index
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [college_key, academic_period_key]

  - name: mart_college_performance
    description: "College Dashboard source: college KPIs plus the campus-wide average that semester, for benchmarking."
    columns:
      - name: college_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_college')
                field: college_key
      - name: academic_period_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_academic_period')
                field: academic_period_key
      - name: institutional_success_index_vs_campus_avg
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [college_key, academic_period_key]

  - name: mart_executive_summary
    description: "Executive Dashboard source: one row per semester, campus-wide, enrollment-weighted rates."
    columns:
      - name: academic_period_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_dim_academic_period')
                field: academic_period_key
      - name: total_enrollment
        tests: [not_null]
      - name: overall_institutional_success_index
        tests: [not_null]

  - name: mart_program_performance
    description: "Program Dashboard source: program-grain enrollment/graduation/dropout counts and rates."
    columns:
      - name: program_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_program')
                field: program_key
      - name: academic_period_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_academic_period')
                field: academic_period_key
      - name: enrollment_count
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [program_key, academic_period_key]

  - name: mart_retention_risk
    description: "Decision-support mart: flags programs whose retention rate has declined for 2 consecutive semesters."
    columns:
      - name: program_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_program')
                field: program_key
      - name: academic_period_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_academic_period')
                field: academic_period_key
      - name: is_declining_two_consecutive_semesters
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [program_key, academic_period_key]